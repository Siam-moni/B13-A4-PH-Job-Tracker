<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <!-- Tailwind+DesyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <section class="p-6 bg-gray text-neutral-content">
      <h1 class="text-3xl font-bold text-black">Job Application Tracker</h1>

      <div class="grid md:grid-cols-1 lg:grid-cols-3 gap-4 mt-6">
        <div class="p-3 bg-base-100 rounded-box">
          <h2 class="text-black">Total Jobs</h2>
          <p class="text-black text-3xl font-bold" id="totalCount">0</p>
        </div>

        <div class="p-3 bg-base-100 rounded-box">
          <h2 class="text-black">Interview</h2>
          <p class="text-green-500 text-3xl font-bold" id="totalCount">0</p>
        </div>

        <div class="p-3 bg-base-100 rounded-box">
          <h2 class="text-black">Rejected</h2>
          <p class="text-red-500 text-3xl font-bold" id="totalCount">0</p>
        </div>
      </div>
    </section>
  </body>
</html>
