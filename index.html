<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Application Tracker</title>
    <!-- Tailwind+DesyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <!-- job track dashboard section -->
    <section class="p-6 bg-gray text-neutral-content">
      <h1 class="text-3xl font-bold text-black">Job Application Tracker</h1>

      <div class="grid md:grid-cols-1 lg:grid-cols-3 gap-4 mt-6">
        <div class="p-3 bg-base-100 rounded-box">
          <h2 class="text-black">Total Jobs</h2>
          <p class="text-black text-3xl font-bold" id="totalCount">0</p>
        </div>

        <div class="p-3 bg-base-100 rounded-box">
          <h2 class="text-black">Interview</h2>
          <p class="text-green-500 text-3xl font-bold" id="interviewCount">0</p>
        </div>

        <div class="p-3 bg-base-100 rounded-box">
          <h2 class="text-black">Rejected</h2>
          <p class="text-red-500 text-3xl font-bold" id="rejectedCount">0</p>
        </div>
      </div>
    </section>
    <!-- job track dashboard section -->
    <section class="p-6">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-semibold">Available Jobs</h2>
        <span class="text-neutral/50" id="jobCount">0</span>
      </div>

      <!-- Tabs -->
      <div class="mt-4">
        <button class="btn mr-4 btn-primary btn-soft px-10" data-tab="all">
          All
        </button>
        <button class="btn mr-4 btn-primary btn-soft" data-tab="interview">
          Interview
        </button>
        <button class="btn mr-4 btn-primary btn-soft" data-tab="rejected">
          Rejected
        </button>
      </div>
      <!-- Active Status Bar -->
      <div class="mb-4">
        <span
          id="activeStatus"
          class="px-4 py-2 rounded-md text-sm font-semibold bg-gray-200 text-gray-700"
        >
          ALL
        </span>
      </div>
      <!-- Cards -->
      <div
        id="jobsContainer"
        class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mt-6"
      ></div>
    </section>
    <section class="p-6">
      <!-- Cards Container -->
      <div id="jobContainer" class="grid md:grid-cols-2 gap-4"></div>

      <!-- No Jobs Message -->
      <div id="noJobMessage" class="hidden text-center py-12">
        <div class="flex flex-col items-center gap-4">
          <img src="./jobs.png" alt="" />
          <h3 class="text-xl font-semibold">No Jobs Available</h3>
          <p class="text-gray-500">Currently no jobs in this category.</p>
        </div>
      </div>
    </section>
    <script src="./Job-Tracker.js"></script>
  </body>
</html>
